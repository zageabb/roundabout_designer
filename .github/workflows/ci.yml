name: Roundabout Designer CI
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate default layout
        run: python3 tests/check_layout.py
      - name: Validate shared lane-network and vehicle pose contracts
        run: node tests/check_network.js
      - name: Verify projected path interactions and temporal separation
        run: node tests/check_conflicts.js
      - name: Validate sized vehicle footprint interactions
        run: node tests/check_footprints.js
      - name: Exercise road geometry
        run: node tests/check_geometry.js
      - name: Check smooth vehicle merge trajectories
        run: node tests/check_merge.js
      - name: Exercise vehicle routes and exits
        run: node tests/check_routes.js
      - name: Test scenario replay and event monitor
        run: node tests/check_scenario.js
      - name: Verify modular source order and browser assets
        run: node tests/check_modules.js
      - name: Smoke-test modular browser startup and playback
        run: node tests/check_runtime.js
      - name: Check browser JavaScript syntax
        run: |
          for file in src/*.js; do node --check "$file"; done
          node -e "require('fs').writeFileSync('/tmp/roundabout.js',require('./tests/read_app').getJavaScript())"
          node --check /tmp/roundabout.js
