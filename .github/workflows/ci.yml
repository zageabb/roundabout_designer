name: Roundabout Designer CI
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate default layout
        run: python3 tests/check_layout.py
      - name: Exercise road geometry
        run: node tests/check_geometry.js
      - name: Check browser JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          code=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/roundabout.js').write_text(code)
          PY
          node --check /tmp/roundabout.js
